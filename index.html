<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>Indian Stock Pro v1.0</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fb;color:#111827}header{background:#0b1220;color:white;padding:20px 16px}.wrap{max-width:1100px;margin:auto}.brand{font-size:24px;font-weight:800}.sub{color:#aab5c7;font-size:12px}.market{margin-top:12px;display:flex;gap:8px}.pill{background:#182337;padding:7px 10px;border-radius:20px;font-size:12px}main{max-width:1100px;margin:auto;padding:16px}.search{position:relative;display:flex;gap:8px;margin:15px 0}.search input{flex:1;padding:13px;border:1px solid #d5dbe5;border-radius:12px;font-size:15px}.search button{border:0;border-radius:12px;background:#2563eb;color:white;padding:0 18px;font-weight:700}.suggestions{position:absolute;top:53px;left:0;right:95px;background:white;border:1px solid #ddd;border-radius:12px;box-shadow:0 10px 30px #0002;display:none;z-index:5}.suggestion{padding:11px 14px;border-bottom:1px solid #eee}.sym{font-weight:800}.name{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card,.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:15px;box-shadow:0 3px 12px #0000000b}.card{cursor:pointer}.head{display:flex;justify-content:space-between}.stock{font-size:18px;font-weight:800}.company{font-size:12px;color:#64748b}.score{font-size:22px;font-weight:900}.bars,.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:#f8fafc;border-radius:9px;padding:9px}.metric small{display:block;color:#64748b;font-size:10px}.metric b{font-size:14px}.why{font-size:12px;color:#475569;margin-top:10px}.detail{display:none}.back{padding:9px 12px;border:0;border-radius:10px;margin-bottom:12px}.reason{padding:10px 0;border-bottom:1px solid #eee;font-size:13px;line-height:1.45}.notice{background:#fff7ed;padding:11px;border-radius:12px;font-size:12px;margin:12px 0}@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(4,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="wrap"><div class="brand">🇮🇳 Indian Stock Pro <span style="font-size:12px;color:#93c5fd">v1.0</span></div><div class="sub">Quant research • 1 week to 1 month</div><div class="market"><div class="pill" id="regime">Market: loading</div><div class="pill" id="updated">Data: —</div></div></div></header><main class="wrap"><section id="home"><h1>🔥 Top 10 Stock Setups</h1><p>Ranked by momentum, relative strength, trend, volume, fundamentals, catalysts and risk/reward.</p><div class="search"><input id="search" placeholder="Search NSE symbol or company name" autocomplete="off"><button onclick="searchStock()">Analyze</button><div id="suggestions" class="suggestions"></div></div><div class="notice"><b>Research mode:</b> scores are decision-support signals, not guaranteed predictions.</div><div id="cards" class="grid"></div></section><section id="detail" class="detail"><button class="back" onclick="home()">← Back</button><div id="detailBody"></div></section></main><script>
let DB={stocks:[],rankings:[],market:{}};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function load(){try{let r=await fetch("data/rankings.json?t="+Date.now());DB=await r.json();render()}catch(e){document.getElementById("cards").innerHTML='<div class="panel"><b>Ranking data is not available yet.</b><br><small>The v1.0 interface is ready; the next stage connects the live ranking engine.</small></div>'}}function render(){regime.textContent="Market: "+(DB.market?.regime||"—");updated.textContent="Data: "+(DB.generated||"—");cards.innerHTML=(DB.rankings||[]).slice(0,10).map((x,i)=>`<article class="card" onclick="openStock('${esc(x.symbol)}')"><div>#${i+1} • ${esc(x.horizon||"1–4 weeks")}</div><div class="head"><div><div class="stock">${esc(x.symbol)}</div><div class="company">${esc(x.company)}</div></div><div style="text-align:right"><div class="score">${x.score}/100</div><b>${esc(x.signal||"Watch")}</b></div></div><div class="bars"><div class="metric"><small>Opportunity</small><b>${x.opportunity??"—"}</b></div><div class="metric"><small>Confidence</small><b>${x.confidence??"—"}</b></div><div class="metric"><small>Risk</small><b>${x.risk??"—"}</b></div></div><div class="why"><b>Why:</b> ${esc((x.reasons||[]).slice(0,2).join(" • "))}</div></article>`).join("")||'<div class="panel">No ranked stocks yet.</div>'}function openStock(s){let x=(DB.rankings||[]).find(a=>a.symbol===s)||(DB.stocks||[]).find(a=>a.symbol===s);if(!x)return;homeSection();detail.style.display="block";detailBody.innerHTML=`<h1>${esc(x.symbol)} — ${esc(x.company)}</h1><div class="panel"><h3>🎯 Overall assessment</h3><div class="metrics"><div class="metric"><small>Opportunity</small><b>${x.opportunity??x.score??"—"}/100</b></div><div class="metric"><small>Confidence</small><b>${x.confidence??"—"}/100</b></div><div class="metric"><small>Risk</small><b>${x.risk??"—"}/100</b></div><div class="metric"><small>Score</small><b>${x.score??"—"}/100</b></div></div></div><div class="panel"><h3>🧠 Why selected</h3>${(x.reasons||[]).map((r,i)=>`<div class="reason"><b>${i+1}.</b> ${esc(r)}</div>`).join("")||"<div>No explanation supplied yet.</div>"}</div><div class="panel"><h3>📊 Factor breakdown</h3><div class="metrics">${Object.entries(x.factors||{}).map(([k,v])=>`<div class="metric"><small>${esc(k)}</small><b>${esc(v)}/100</b></div>`).join("")||"<div class='metric'>Pending engine</div>"}</div></div><div class="panel"><h3>🎯 Trade setup</h3><div class="metrics"><div class="metric"><small>Current</small><b>${esc(x.price||"—")}</b></div><div class="metric"><small>Entry</small><b>${esc(x.entry||"—")}</b></div><div class="metric"><small>Target</small><b>${esc(x.target||"—")}</b></div><div class="metric"><small>Invalidation</small><b>${esc(x.stop||"—")}</b></div></div></div><div class="panel"><h3>📰 Catalysts & risks</h3><div class="reason"><b>Positive:</b> ${esc((x.catalysts||[]).join(" • ")||"Pending")}</div><div class="reason"><b>Risks:</b> ${esc((x.risks||[]).join(" • ")||"Pending")}</div></div>`}function homeSection(){home.style.display="none"}function home(){detail.style.display="none";home.style.display="block"}function searchStock(){let s=search.value.trim().toUpperCase();if(s)openStock(s)}search.addEventListener("input",()=>{let q=search.value.trim().toUpperCase();if(!q){suggestions.style.display="none";return}let a=(DB.stocks||[]).filter(x=>(x.symbol||"").toUpperCase().includes(q)||(x.company||"").toUpperCase().includes(q)).slice(0,8);suggestions.innerHTML=a.map(x=>`<div class="suggestion" onclick="search.value='${esc(x.symbol)}';suggestions.style.display='none';openStock('${esc(x.symbol)}')"><div class="sym">${esc(x.symbol)}</div><div class="name">${esc(x.company)}</div></div>`).join("");suggestions.style.display=a.length?"block":"none"});load();
</script></body></html>
